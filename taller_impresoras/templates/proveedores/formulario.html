{% extends "base.html" %}

{% block title %}{{ accion }} Proveedor - Taller de Impresoras{% endblock %}

{% block content %}
<div class="container-fluid">
    <h1 class="mb-4"><i class="bi bi-plus-lg me-2"></i>{{ accion }} Proveedor</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" name="nombre" class="form-control" value="{{ proveedor.nombre if proveedor else '' }}" required placeholder="Nombre">
                            <label for="nombre">Nombre *</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" name="contacto" class="form-control" value="{{ proveedor.contacto if proveedor else '' }}" placeholder="Persona de Contacto">
                            <label for="contacto">Persona de Contacto</label>
                        </div>
                    </div>
                </div>
                
                <div class="row g-3 mt-0">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" name="telefono" class="form-control" value="{{ proveedor.telefono if proveedor else '' }}" placeholder="Teléfono">
                            <label for="telefono">Teléfono</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select name="tipo" class="form-select">
                                <option value="" disabled selected hidden>Seleccione una opción...</option>
                                <option value="informal" {% if proveedor and proveedor.tipo == 'informal' %}selected{% endif %}>Informal</option>
                                <option value="formal" {% if proveedor and proveedor.tipo == 'formal' %}selected{% endif %}>Formal</option>
                            </select>
                            <label for="tipo">Tipo</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('proveedores.index') }}" class="btn btn-secondary"><i class="bi bi-arrow-left me-2"></i>Volver</a>
                    <button type="submit" class="btn btn-primary d-inline-flex align-items-center">
                        <i class="bi bi-floppy me-2"></i>Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
